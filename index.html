<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predictor - French Virtual League</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Predictor - French Virtual League</h1>
    <p class="sub">Dataset: <code>data/france_virtual_league.csv</code></p>
  </header>

  <main class="container">
    <section class="card">
      <div class="controls">
        <label>
          Mode:
          <select id="mode">
            <option value="1x2" selected>1X2</option>
            <option value="gng">G / NG</option>
            <option value="score">Score Exact</option>
          </select>
        </label>

        <label>
          Home:
          <input id="homeTeam" placeholder="ex: Paris SG" />
        </label>

        <label>
          Away:
          <input id="awayTeam" placeholder="ex: Brest" />
        </label>

        <button id="predictBtn">Predict</button>
      </div>

      <div id="result" class="result">
        <p>Safidio ny mode, fenoy Home/Away dia tsindrio Predict.</p>
      </div>
    </section>

    <section class="card">
      <h2>Matches (from CSV)</h2>
      <div class="table-wrap">
        <table id="matchesTable">
          <thead>
            <tr>
              <th>Journée</th>
              <th>Home</th>
              <th>Away</th>
              <th>Odd 1</th>
              <th>Odd X</th>
              <th>Odd 2</th>
              <th>Odd G</th>
              <th>Odd NG</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
