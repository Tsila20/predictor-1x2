<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Predictor Bet261 - French Virtual League</title>

  <meta name="theme-color" content="#16a34a" />
  <meta name="description" content="Predictor Bet261 - Ampidiro ny Odds 1/X/2 dia mahazo Résultat + % + Score Exact." />

  <!-- ICON -->
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=2" />
  <link rel="apple-touch-icon" href="icon-512.png?v=2" />

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json?v=2" />

  <!-- ✅ FORCE CSS RELOAD (CACHE FIX) -->
  <link rel="stylesheet" href="style.css?v=3" />

</head>

<body>
  <div class="container">
    <h1>Predictor <span class="bet261-badge">BET261</span></h1>
    <p class="subtitle">Ampidiro ny Odds 1 / X / 2 dia mahazo Résultat + % + Score Exact.</p>

    <div class="card">
      <label for="mode">Mode:</label>
      <select id="mode">
        <option value="1x2">1X2</option>
        <option value="exact">Score Exact</option>
      </select>

      <label>Odd 1 (Home)</label>
      <input id="odd1" type="text" inputmode="decimal" placeholder="ex: 2.30 na 2,30" />

      <label>Odd X (Draw)</label>
      <input id="oddX" type="text" inputmode="decimal" placeholder="ex: 5.00 na 5,00" />

      <label>Odd 2 (Away)</label>
      <input id="odd2" type="text" inputmode="decimal" placeholder="ex: 3.40 na 3,40" />

      <button id="predictBtn" class="btn-bet261">Predict</button>

      <div id="resultBox" class="result">
        Safidio mode, fenoy ny odds, dia tsindrio Predict.
      </div>
    </div>

    <div class="card">
      <h2>Matches (from CSV)</h2>
      <p class="subtitle">Dataset: <code>data/france_virtual_league.csv</code></p>
      <div class="tableWrap">
        <table id="matchesTable">
          <thead>
            <tr>
              <th>Journée</th>
              <th>Home</th>
              <th>Away</th>
              <th>Odd 1</th>
              <th>Odd X</th>
              <th>Odd 2</th>
              <th>Odd G</th>
              <th>Odd NG</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <p class="footer-bet261">⚡ Predictor Bet261 • Smart Betting • Data Mode</p>
  </div>

  <!-- JS -->
  <script src="script.js?v=3"></script>
</body>
</html>
