    <!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bet261 Tool - Predictor 1X2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
  <h1>⚽ Bet261 Tool</h1>
  <p class="sub">Analyse 1X2 + marge bookmaker + stake intelligent (Kelly)</p>

  <div class="card">

    <label>Cote 1 (Home)</label>
    <input type="number" step="0.01" id="odd1" placeholder="ex: 2.28" />

    <label>Cote X (Draw)</label>
    <input type="number" step="0.01" id="oddX" placeholder="ex: 3.47" />

    <label>Cote 2 (Away)</label>
    <input type="number" step="0.01" id="odd2" placeholder="ex: 3.01" />

    <hr>

    <label>Bankroll (Ar)</label>
    <input type="number" id="bankroll" placeholder="ex: 100000" />

    <label>Your probability for best pick (optional, %)</label>
    <input type="number" step="0.01" id="myProb" placeholder="ex: 55" />

    <label>Stake (Ar) (optional)</label>
    <input type="number" id="stake" placeholder="ex: 5000" />

    <label>Stake mode</label>
    <select id="stakeMode">
      <option value="none">No suggestion</option>
      <option value="kelly">Kelly</option>
      <option value="halfkelly">Half-Kelly</option>
    </select>

    <button onclick="calc()">Analyser</button>
  </div>

  <div class="card">
    <h2>Résultats</h2>

    <div class="grid">
      <div class="box">
        <div class="k">Proba 1</div>
        <div class="v" id="p1">-</div>
      </div>

      <div class="box">
        <div class="k">Proba X</div>
        <div class="v" id="pX">-</div>
      </div>

      <div class="box">
        <div class="k">Proba 2</div>
        <div class="v" id="p2">-</div>
      </div>
    </div>

    <p class="meta">Marge bookmaker: <b id="margin">-</b></p>
    <p class="pick">Outcome probable: <b id="pick">-</b></p>
    <p class="meta">Stake conseillé: <b id="stakeResult">-</b></p>

  </div>

  <div class="footer">
    <small>⚠️ Outil d’analyse basé sur probabilités des cotes.</small>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
