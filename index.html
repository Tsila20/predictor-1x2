<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predictor - French Virtual League</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <h1>Predictor - French Virtual League</h1>
    <p class="subtitle">Ampidiro ny Odds 1 / X / 2 dia mahazo Résultat + % + Score Exact.</p>

    <div class="card">
      <label for="mode">Mode:</label>
      <select id="mode">
        <option value="1x2">1X2</option>
        <option value="exact">Score Exact</option>
      </select>

      <label>Odd 1 (Home)</label>
      <input id="odd1" type="number" step="0.01" placeholder="ex: 2.30" />

      <label>Odd X (Draw)</label>
      <input id="oddX" type="number" step="0.01" placeholder="ex: 5.00" />

      <label>Odd 2 (Away)</label>
      <input id="odd2" type="number" step="0.01" placeholder="ex: 3.40" />

      <button id="predictBtn">Predict</button>

      <div id="resultBox" class="result">
        Safidio mode, fenoy ny odds, dia tsindrio Predict.
      </div>
    </div>

    <div class="card">
      <h2>Matches (from CSV)</h2>
      <p class="subtitle">Dataset: <code>data/france_virtual_league.csv</code></p>
      <div class="tableWrap">
        <table id="matchesTable">
          <thead>
            <tr>
              <th>Journée</th>
              <th>Home</th>
              <th>Away</th>
              <th>Odd 1</th>
              <th>Odd X</th>
              <th>Odd 2</th>
              <th>Odd G</th>
              <th>Odd NG</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
