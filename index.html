<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Preductor 1X2</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>⚽ Preductor 1X2 — Virtual League</h1>

    <div class="controls">
      <button id="btnLoad">Charger Journées (raw)</button>

      <select id="leagueSelect"></select>
      <select id="journeeSelect"></select>

      <label class="toggle">
        <input type="checkbox" id="onlyValue" />
        <span>Value only</span>
      </label>

      <label class="toggle">
        <input type="checkbox" id="onlyHighConf" />
        <span>High confidence only</span>
      </label>
    </div>

    <div id="summary" class="card"></div>
    <div id="tableWrap" class="card"></div>
  </div>

<script src="script.js"></script>
</body>
</html>
